<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ð-Sen. Official Links</title>
    
    <!-- 🔍 【限定公開設定】Googleなどの検索エンジンに載るのを完全に防ぐお守り -->
    <meta name="robots" content="noindex, nofollow">

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: #333;
            margin: 0 auto 15px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .id-text {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .link-card {
            display: block;
            background-color: #1e1e1e;
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.2s;
            border: 1px solid #333;
        }
        .link-card:hover {
            background-color: #2a2a2a;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-img"></div>
    <h1>Ð-Sen.</h1>
    <div class="id-text">@YusehamadzSen</div>

    <a class="link-card" href="https://youtube.com" target="_blank">YouTube</a>
    <a class="link-card" href="https://x.com" target="_blank">X (Twitter)</a>
    <a class="link-card" href="https://note.com" target="_blank">note</a>
    <a class="link-card" href="https://soundcloud.com" target="_blank">SoundCloud</a>
    <a class="link-card" href="https://github.com" target="_blank">GitHub</a>
</div>

</body>
</html>
