<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Ð-Sen. Official Website</title>
    
    <!-- タブのアイコン -->
    <link rel="icon" href="https://yt3.ggpht.com/aDpEJtO6irJguO3GiBAghxLclzHMBK1QsP-R2bG0IwYIsKCjtja7oQI09n6zRHm6-Ocg555TLBU=s1800-c-k-c0x00ffffff-no-rj-rp-mo?v=2">

    <style>
        body {
            background-color: #0d1117; /* ダークモード黒 */
            color: #c9d1d9;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }
        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            color: #8b949e;
            font-size: 1.1rem;
        }
        
        .btn-container {
            margin-top: 30px;
        }
        .link-card {
            display: inline-block;
            width: 100%;
            max-width: 300px;
            background-color: #1e1e1e;
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.2s;
            border: 1px solid #333;
            box-sizing: border-box;
        }
        .link-card:hover {
            background-color: #2a2a2a;
            transform: scale(1.02);
        }
        /* ▲▲▲ ここまで ▲▲▲ */
    </style>
</head>
<body>

    <div class="container">
        <!-- 文字 -->
        <h1>Ð-Sen. Official Website</h1>
        <p>Welcome to my official homepage!</p>

        <!-- view links -->
        <div class="btn-container">
